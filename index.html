<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pausa CiberWeek - Neural Net</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Figtree', sans-serif;
            background-color: #050508;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://raw.githubusercontent.com/gilnei-ship-it/CiberWeek/main/WhatsApp%20Image%202026-09-28%20at%2008.51.21.jpeg');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .glass-container {
            position: absolute;
            bottom: 8%;
            right: 5%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 12px;
            z-index: 10;
            
            /* Define a base do contêiner para as transições absolutas funcionarem perfeitamente */
            min-width: 380px;
            min-height: 160px; 
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .slide {
            position: absolute;
            left: 40px; /* Respeitando o padding do container */
            right: 40px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-out;
            pointer-events: none;
            text-align: left;
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .title {
            font-size: 31px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #ffffff;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #e0e0e0;
        }

        .content {
            font-size: 14px;
            font-weight: 300;
            color: #b0b0b0;
            margin: 0;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="glass-container">
        <!-- Tela 1 -->
        <div class="slide active">
            <h1 class="title">Voltamos em instantes</h1>
            <p class="subtitle">Estamos preparando a próxima etapa.</p>
        </div>
        <!-- Tela 2 -->
        <div class="slide">
            <h1 class="title">Pausa para o café</h1>
            <p class="subtitle">Aproveite para recarregar as energias.</p>
            <p class="content">Networking também faz parte do evento.</p>
        </div>
        <!-- Tela 3 -->
        <div class="slide">
            <h1 class="title">Quase prontos...</h1>
            <p class="subtitle">Os sistemas estão sendo atualizados.</p>
            <p class="content">Acomode-se, já vamos recomeçar.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        window.addEventListener('resize', () => {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvasWidth;
                this.y = Math.random() * canvasHeight;
                // Tamanho sutil (1 a 2px)
                this.size = Math.random() * 1 + 1; 
                // Movimento muito lento e contínuo
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                // Cores sutis, alinhadas à paleta de tecnologia (branco azulado/laranja bem suave)
                const isOrange = Math.random() > 0.8;
                this.color = isOrange ? 'rgba(255, 130, 0, 0.6)' : 'rgba(180, 220, 255, 0.6)';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Rebater nas bordas suavemente
                if (this.x > canvasWidth || this.x < 0) this.speedX *= -1;
                if (this.y > canvasHeight || this.y < 0) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            // Máximo absoluto de 40 partículas para não poluir visualmente
            const numberOfParticles = Math.min(40, Math.floor((canvasWidth * canvasHeight) / 25000));

            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            const maxDistance = 120; 
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        // Opacidade máxima de 0.15 para linhas bem discretas
                        let opacity = (1 - (distance / maxDistance)) * 0.15;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(200, 220, 255, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Lógica de navegação de slides
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        document.body.addEventListener('click', () => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        });
    </script>
</body>
</html>
