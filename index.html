<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pausa CiberWeek</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Figtree', sans-serif;
            background-color: #000;
            cursor: pointer;
            user-select: none;
        }

        .title {
            font-size: 31px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #ffffff;
            letter-spacing: 0.01em;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #f0f0f0;
        }

        .content {
            font-size: 14px;
            font-weight: 300;
            color: #cccccc;
            margin: 0;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://raw.githubusercontent.com/gilnei-ship-it/CiberWeek/main/WhatsApp%20Image%202026-09-28%20at%2008.51.21.jpeg');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Partículas ficam atrás do cartão de vidro */
            pointer-events: none;
        }

        .glass-card {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(10, 15, 30, 0.4);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            
            /* Usando Grid para sobrepor as telas (slides) suavemente */
            display: grid;
            min-width: 320px;
            text-align: center;
        }

        .slide {
            grid-area: 1 / 1;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="glass-card">
        <!-- Tela 1 -->
        <div class="slide active">
            <h1 class="title">Voltamos em instantes</h1>
            <p class="subtitle">Estamos preparando tudo para você.</p>
        </div>
        <!-- Tela 2 -->
        <div class="slide">
            <h1 class="title">Pausa para o café</h1>
            <p class="subtitle">Aproveite para recarregar as energias.</p>
        </div>
        <!-- Tela 3 -->
        <div class="slide">
            <h1 class="title">Fique ligado</h1>
            <p class="subtitle">Logo retornaremos com a programação.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        window.addEventListener('resize', () => {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            initParticles();
        });

        const colors = ['#FF6B00', '#00D2FF'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvasWidth;
                this.y = Math.random() * canvasHeight;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvasWidth || this.x < 0) this.speedX *= -1;
                if (this.y > canvasHeight || this.y < 0) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Efeito Glow (Brilho)
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                ctx.fill();
                
                // Resetando sombra para a linha de conexão
                ctx.shadowBlur = 0; 
            }
        }

        function initParticles() {
            particlesArray = [];
            // Densidade de partículas calculada pela área
            let numberOfParticles = (canvasWidth * canvasHeight) / 11000;
            if (numberOfParticles > 90) numberOfParticles = 90; // Limite para performance

            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            let maxDistance = 140; 
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        let opacity = (1 - (distance / maxDistance)) * 0.25;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        // Avança o slide invisivelmente ao clicar em qualquer lugar da página
        document.body.addEventListener('click', () => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        });
    </script>
</body>
</html>
